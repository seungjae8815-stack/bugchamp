name: app
description: "Bug Champ — 곤충 채집 배틀 게임 (Flutter 앱)."
publish_to: 'none'
# 빌드번호는 **매 빌드 +1 하는 단조 증가 숫자**다(날짜처럼 생겼을 뿐).
# 하루에 두 번 빌드해도 겹치면 안 된다 — 1.0.4 와 1.0.5 가 둘 다 20260808 이라
# 그대로 올렸으면 두 스토어 모두 거부했다. 출시 리듬은 docs/release_cadence.md.
version: 1.0.8+20260904
resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 워크스페이스 내부 패키지
  core_models:
    path: ../core_models
  core_battle:
    path: ../core_battle
  core_gathering:
    path: ../core_gathering
  core_run:
    path: ../core_run
  core_save:
    path: ../core_save

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  uuid: ^4.5.3
  collection: ^1.19.1
  http: ^1.2.2
  supabase_flutter: ^2.6.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  # 스토어 리뷰 요청(보상 없음 — 정책상 평점에 보상을 걸 수 없다).
  in_app_review: ^2.0.9
  sign_in_with_apple: ^6.1.0
  app_tracking_transparency: ^2.0.6
  crypto: ^3.0.6
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  google_sign_in: ^7.2.0
  # StoreKit1 고정: 3.2.0 은 in_app_purchase_storekit 0.4.x(StoreKit2)를 끌어와
  # serverVerificationData 가 JWS 가 되어 Apple verifyReceipt 가 21002 로 거부한다.
  # 3.1.x 는 storekit 0.3.x(StoreKit1)라 base64 영수증 → 서버 검증(verifyReceipt) 동작.
  in_app_purchase: '>=3.1.0 <3.2.0'
  google_mobile_ads: ^5.3.1
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.0

# ── Play Billing 8.0.0 (Google Play 요구, 2026-08-31 마감) ──
# in_app_purchase 3.1.x 는 android 구현 ^0.3.x(Billing 6.2.0)를 쓴다. 3.3.0 으로
# 올리면 해결되지만 iOS 가 StoreKit2 로 바뀌어 서버 verifyReceipt 가 깨진다
# (위 `<3.2.0` 고정 사유). 그래서 **안드로이드 구현만** 0.5.0(Billing 8.0.0)으로
# 강제한다 — 0.3.6 과 0.5.0 은 같은 platform_interface ^1.4.0 을 구현하고,
# 앱은 android 전용 API 를 안 쓰므로 Dart 계약이 그대로다.
# iOS 영수증을 JWS 검증으로 전환하면 이 오버라이드를 지우고 3.3.0 으로 올린다.
dependency_overrides:
  in_app_purchase_android: 0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# 런처 아이콘 생성: 이미지 교체 후 `dart run flutter_launcher_icons` 재실행.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true          # App Store 아이콘은 알파(투명) 금지 → 배경색으로 평탄화
  background_color_ios: "#0E1608"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0E1608"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true   # ARB 기반 다국어 코드 생성 활성화

  assets:
    - assets/data/
    - assets/images/character/
    - assets/images/habitats/
    - assets/images/bosses/
    - assets/images/regions/
    - assets/images/materials/
    - assets/images/upgrades/
    - assets/images/buffs/
    - assets/images/bugs/
    - assets/images/biomes/
    - assets/images/items/
    - assets/images/ui/
    # ⚠️ Flutter 는 **하위 디렉토리를 자동 포함하지 않는다.** 폴더를 새로 만들면
    # 여기에 한 줄 더 적어야 번들에 들어간다(안 적으면 이미지가 조용히 폴백된다).
    - assets/images/ui/cards/
    - assets/images/ui/element/
    - assets/images/ui/sex/
    - assets/images/ui/league/
    - assets/images/ui/trait/
    - assets/images/ui/stance/
    - assets/images/ui/temperament/
    - assets/images/ui/event/
    - assets/images/shop/
    - assets/sounds/

  # 타이틀 제목용. Jua (SIL OFL 1.1 — 상업 이용·번들 배포 가능, Jua-OFL.txt 동봉).
  # 기본 폰트로는 손그림 타이틀 아트와 톤이 안 맞아서 넣었다.
  fonts:
    - family: Jua
      fonts:
        - asset: assets/fonts/Jua-Regular.ttf
